# USER_CONFIG — Fintech / Payments / Banking
# Suitable for: payment apps, digital wallets, lending, banking platforms
# ─────────────────────────────────────────────────────────────
# HOW TO USE:
#   1. Copy everything from the yaml block below
#   2. Paste into Claude: Settings → Custom Instructions → "How should Claude respond?"
#      OR into your Claude Project Instructions tab
#   3. Replace placeholder values with your real project details
#   4. Replace the example stories with 2–3 real ones from your product
#
# ⚠️  FINTECH NOTE: Always tag stories with 'needs-compliance-review'
#     and ensure your compliance team reviews AC before development starts.
# ─────────────────────────────────────────────────────────────

project:
  name: "My Fintech Product"
  domain: "fintech"
  team_size: "5 devs, 1 designer, 1 QA, 1 compliance reviewer"

personas:
  - name: "Verified User"
    description: "A user who has completed KYC verification and can transact"
  - name: "Unverified User"
    description: "A user who has registered but not yet completed identity verification"
  - name: "Business Account Owner"
    description: "A user managing a business account with multiple sub-users"
  - name: "Compliance Officer"
    description: "Internal team member reviewing transactions and flagged activity"
  - name: "Support Agent"
    description: "Internal team member resolving customer issues via admin panel"

design_references:
  figma_base_url: "https://www.figma.com/file/REPLACE_WITH_YOUR_FILE_ID"
  design_system: "Replace with your system"
  component_library: "Replace with Storybook link"
  compliance_notes: "All new screens must be reviewed by compliance before dev start"

jira:
  enabled: false                             # Set true after Jira MCP setup
  project_key: "FIN"                         # Replace with your Jira project key
  issue_type: "Story"
  default_epic_link: ""
  story_points_field: "customfield_10016"    # Verify in your Jira instance
  labels: ["ai-generated", "needs-refinement", "fintech", "needs-compliance-review"]

examples:
  - title: "Verified user can send money to a saved contact"
    motivation: >
      As a verified user, I want to send money to a saved contact
      so that I can make repeat payments quickly without re-entering details.
    relevant_info:
      - "Design: Figma — Send Money Flow > Select Contact"
      - "Transfer API: POST /v2/transfers — requires source_account, destination_contact_id, amount, currency"
      - "Daily transfer limit: £10,000 (enforce client-side and server-side)"
      - "Contacts stored in GET /v1/contacts — already implemented"
      - "Compliance: Transfers above £5,000 require additional confirmation step (regulatory)"
      - "Related epic: Money Movement"
    open_questions:
      - "Do we show the recipient's masked account number for confirmation before sending?"
      - "What happens if the recipient's account is closed or invalid at transfer time?"
      - "Should we send a push notification to both sender and recipient on completion?"
      - "How do we handle insufficient funds — decline immediately or show error after confirmation screen?"
    acceptance_criteria:
      - "Given I am a verified user, when I select a saved contact and enter an amount within my limit, then I can review and confirm the transfer"
      - "Given I confirm the transfer, when it processes successfully, then I see a confirmation screen with a transaction reference"
      - "Given I enter an amount exceeding my daily limit, when I try to proceed, then I see a message explaining the limit"
      - "Given the transfer amount is above £5,000, when I confirm, then I am prompted for an additional verification step before processing"
    out_of_scope:
      - "Adding new contacts (separate story)"
      - "International / cross-currency transfers"
      - "Scheduled or recurring payments"

  - title: "Unverified user is prompted to complete KYC to unlock transfers"
    motivation: >
      As an unverified user, I want to understand what I need to do to unlock transfers
      so that I can start using the full product without confusion about why I'm blocked.
    relevant_info:
      - "Design: Figma — KYC Gate > Blocked Action State"
      - "KYC status returned in GET /v1/users/{id}/profile — field 'kyc_status'"
      - "KYC flow is a separate native screen — link to it, don't embed"
      - "Compliance requirement: user must not be able to initiate any transfer without verified status"
    open_questions:
      - "Should we show a progress indicator for how many KYC steps remain?"
      - "Do we send a reminder push notification if KYC is started but not completed?"
      - "What is the fallback if KYC provider is unavailable?"
    acceptance_criteria:
      - "Given I am an unverified user, when I try to initiate a transfer, then I see a screen explaining I need to complete identity verification first"
      - "Given I see the KYC prompt, when I tap 'Verify Now', then I am taken to the KYC flow"
      - "Given I complete KYC successfully, when I return to the transfer screen, then I can proceed normally"
    out_of_scope:
      - "The KYC verification flow itself (separate epic)"
      - "Partial feature access for unverified users"
      - "Business account KYC (different regulatory flow)"
